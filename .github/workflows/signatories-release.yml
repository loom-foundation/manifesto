name: Daily signatories release

# Signatories land continuously by pull request but are released in a daily
# batch rather than one deploy per signature. This job runs once a day, checks
# whether any signatory files changed since the last production deploy (the
# `prod` tag advanced by release.yml), and only then triggers a rebuild and
# release. If nothing changed, it skips — no build, no deploy.
on:
  schedule:
    - cron: '17 6 * * *' # daily at 06:17 UTC
  workflow_dispatch:

# No concurrency group here on purpose: this workflow calls release.yml, which
# declares `concurrency: release-prod` itself. Sharing that group between caller
# and callee deadlocks the reusable call, so serialization of actual deploys is
# left entirely to release.yml (which applies whether it runs directly or is
# called from here).

# Least privilege by default; jobs opt into exactly what they need.
permissions: {}

jobs:
  check:
    name: Check for new signatories
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff signatories against last deploy
        id: diff
        run: |
          git fetch --tags --force origin
          if git rev-parse -q --verify refs/tags/prod >/dev/null; then
            last=$(git rev-parse refs/tags/prod)
            if git diff --quiet "$last" HEAD -- signatories/; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "No signatory changes since $last — skipping release."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Signatory changes detected since $last:"
              git diff --name-only "$last" HEAD -- signatories/
            fi
          else
            # No prod tag yet (site never released through this pipeline).
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No prod tag found — releasing to establish the baseline."
          fi

  release:
    name: Release
    needs: check
    if: needs.check.outputs.changed == 'true'
    # The repo's default token is read-only, and a called workflow cannot hold
    # more than its caller grants. release.yml's tag job needs to push the prod
    # tag, so grant contents:write here as the ceiling for the reusable run.
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    secrets: inherit
