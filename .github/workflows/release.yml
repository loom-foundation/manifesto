name: Release

# Builds, tests, and deploys the site to production (theloommanifesto.org on
# Cloudflare Pages). Runs when the manifesto or site source changes on main,
# from the manual "Run workflow" button, or when called by the daily
# signatories workflow. A failing build or verification blocks the deploy.
on:
  push:
    branches: [main]
    paths:
      - 'manifesto.md'
      - 'site/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/check-build.mjs'
  workflow_dispatch:
  workflow_call:

# Serialise with the daily signatories release so two runs never deploy at once.
concurrency:
  group: release-prod
  cancel-in-progress: false

env:
  # The Cloudflare Pages project to deploy to. Change this if the project is
  # named differently in your Cloudflare account.
  CF_PAGES_PROJECT: theloommanifesto

# Least privilege by default; jobs opt into exactly what they need.
permissions: {}

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The site + manifesto content live in this repo; the brand artefacts
      # (favicon, wordmarks, logo) live in the public loom-foundation/org repo.
      # Both are checked out so the sibling paths the build expects resolve:
      #   <workspace>/manifesto/site  and  <workspace>/org/brand/assets
      - name: Checkout site + content
        uses: actions/checkout@v4
        with:
          path: manifesto
          fetch-depth: 0
          # This job never pushes; keep the token out of git config while
          # third-party install/build scripts (sharp, esbuild) run.
          persist-credentials: false

      - name: Checkout brand assets
        uses: actions/checkout@v4
        with:
          repository: loom-foundation/org
          path: org
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manifesto/site/package-lock.json

      - name: Install dependencies
        working-directory: manifesto/site
        run: npm ci

      - name: Type check
        working-directory: manifesto/site
        run: npm run check

      - name: Build
        working-directory: manifesto/site
        run: npm run build

      - name: Verify build output
        run: node manifesto/.github/scripts/check-build.mjs manifesto/site/dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: manifesto/site/dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://theloommanifesto.org
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=main

  tag:
    name: Mark deployed commit
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # Move the `prod` tag to the just-deployed commit. The daily signatories
      # workflow diffs signatories/ between this tag and HEAD to decide whether
      # a rebuild is warranted, so every deploy must advance it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Advance prod tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f prod "$GITHUB_SHA"
          git push -f origin refs/tags/prod
